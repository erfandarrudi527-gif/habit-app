<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barg — Read Persian, at your pace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">

  <!-- ════════════ 1 · WELCOME ════════════ -->
  <section class="screen active" id="scr-welcome">
    <div class="screen-pad welcome">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
        <span class="brand-name">Barg</span>
      </div>

      <div class="welcome-art">
        <svg viewBox="0 0 160 140" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 18h84l16 16v88H30z"/>
          <path d="M114 18v16h16"/>
          <path d="M50 62c0-6 5-10 10-10 4 0 7 2 9 5 2-3 5-5 9-5 5 0 10 4 10 10 0 9-12 15-19 21-7-6-19-12-19-21z"/>
          <path d="M50 98h60M50 110h44"/>
        </svg>
      </div>

      <h1 class="serif-h">Read Persian,<br>at your pace.</h1>
      <p class="sub">Vowel marks when you need them, real sentences, and words that actually stick.</p>

      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>

      <button class="btn-primary" data-nav="scr-level">Get started</button>
    </div>
  </section>

  <!-- ════════════ 2 · ONBOARDING · LEVEL ════════════ -->
  <section class="screen" id="scr-level">
    <div class="screen-pad">
      <h1 class="serif-h left">What's your reading level?</h1>
      <p class="sub">You can change this anytime in settings.</p>

      <div class="level-list" id="levelList">
        <button class="level-card" data-level="A1"><span class="lv-code">A1</span><span class="lv-desc">Just starting out</span></button>
        <button class="level-card" data-level="A2"><span class="lv-code">A2</span><span class="lv-desc">Basic sentences</span></button>
        <button class="level-card selected" data-level="B1"><span class="lv-code">B1</span><span class="lv-desc">Comfortable with simple texts</span><svg class="lv-check" viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5l3.5 3.5L11 1"/></svg></button>
        <button class="level-card" data-level="B2"><span class="lv-code">B2</span><span class="lv-desc">Reading independently</span></button>
        <button class="level-card" data-level="C1"><span class="lv-code">C1</span><span class="lv-desc">Advanced texts</span></button>
      </div>

      <button class="btn-dashed">Not sure? Take a quick test</button>
      <button class="btn-primary" data-nav="scr-home">Continue</button>
    </div>
  </section>

  <!-- ════════════ 3 · HOME ════════════ -->
  <section class="screen" id="scr-home">
    <div class="screen-pad">
      <header class="home-top">
        <span class="home-stat" id="homeStat">Level B1 · 62 words saved</span>
        <div class="home-top-right">
          <button class="theme-toggle" id="themeHome" title="Dark mode">
            <svg class="ic-moon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10.5A6.5 6.5 0 017.5 3 6.5 6.5 0 1015 10.5z"/></svg>
            <svg class="ic-sun" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="9" cy="9" r="3.4"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M14.3 3.7l-1.4 1.4M5.1 12.9l-1.4 1.4"/></svg>
          </button>
          <span class="avatar">S</span>
        </div>
      </header>

      <div class="streak-card">
        <div class="streak-head">
          <span class="streak-title">This week</span>
          <span class="streak-days">🔥 3 day streak</span>
        </div>
        <div class="week">
          <div class="day"><span>S</span><i class="dotc filled"></i></div>
          <div class="day"><span>M</span><i class="dotc filled"></i></div>
          <div class="day"><span>T</span><i class="dotc filled"></i></div>
          <div class="day"><span>W</span><i class="dotc"></i></div>
          <div class="day"><span>T</span><i class="dotc"></i></div>
          <div class="day"><span>F</span><i class="dotc"></i></div>
          <div class="day"><span>S</span><i class="dotc"></i></div>
        </div>
      </div>

      <button class="review-card">
        <span>Review words</span><span class="due">12 due →</span>
      </button>

      <p class="section-label">Your reading</p>

      <div class="story-list" id="storyList"><!-- injected by app.js --></div>
    </div>
  </section>

  <!-- ════════════ 4 · READING ════════════ -->
  <section class="screen" id="scr-reading">
    <div class="screen-pad reading-pad">
      <div class="reading-top">
        <div class="menu-wrap">
          <button class="menu-btn" id="menuBtn" title="Options" aria-haspopup="true">
            <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="10" cy="16" r="1.6"/></svg>
          </button>
          <div class="menu-pop hidden" id="menuPop">
            <button class="menu-item" data-act="translate"><span>English translation</span><i id="miTranslate">off</i></button>
            <button class="menu-item" data-act="vowels"><span>Vowel marks</span><i id="miVowels">off</i></button>
            <button class="menu-item" data-act="speed"><span>Playback speed</span><i id="miSpeed">1.0×</i></button>
            <button class="menu-item" data-act="theme"><span>Dark mode</span><i id="miTheme">off</i></button>
            <hr class="menu-sep">
            <button class="menu-item" data-act="home"><span>Back to library</span><i>→</i></button>
          </div>
        </div>
        <div class="lv-stepper" title="Reading level — raise or lower it">
          <button class="lv-arrow" id="lvDown" aria-label="Lower level">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4l3.5 4 3.5-4"/></svg>
          </button>
          <span class="lv-now" id="lvNow">B1</span>
          <button class="lv-arrow" id="lvUp" aria-label="Raise level">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 8l3.5-4 3.5 4"/></svg>
          </button>
        </div>
      </div>

      <div class="reading-scroll" id="readingScroll">
        <img class="story-hero" id="storyHero" src="assets/mouse.png" alt="">
        <h2 class="story-title fa" id="storyTitle"></h2>
        <p class="story-title-en" id="storyTitleEn"></p>
        <div class="story-body fa" id="storyBody"></div>
      </div>

      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

      <div class="controls">
        <button class="ctrl" id="btnTranslate">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7M5.5 2.5V4M7 4c-.5 3-2.5 5.5-5 7M4 7c1 2 3 3.5 5 4"/><path d="M9 14l3-7 3 7M10 11.5h4"/></svg>
          <span>Translate</span>
        </button>
        <button class="ctrl" id="btnVowels">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2 10c1.5-3 3-4.5 6-4.5S13 8 14 10"/><path d="M4 4.5l1-1M8 3.5v-1.2M12 4.5l-1-1"/></svg>
          <span>Vowels</span>
        </button>
        <button class="ctrl on" id="btnSpeed">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>
          <span id="speedLabel">1.0×</span>
        </button>
      </div>
    </div>

    <!-- word popup -->
    <div class="popup-backdrop hidden" id="popupBackdrop"></div>
    <div class="word-popup hidden" id="wordPopup">
      <div class="popup-inner">
        <div class="popup-head">
          <button class="popup-close" id="popupClose">
            <svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M1 1l8 8M9 1l-8 8"/></svg>
          </button>
          <span class="popup-word fa" id="popupWord"></span>
          <button class="popup-audio" id="popupAudio" title="Listen">
            <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h2.5L9 3v9L5.5 9.5H3z"/><path d="M11 5.5a3.5 3.5 0 010 4M12.5 4a5.5 5.5 0 010 7"/></svg>
          </button>
        </div>
        <p class="popup-translit" id="popupTranslit"></p>
        <p class="popup-gloss" id="popupGloss"></p>
        <div class="popup-marks" id="popupMarks" title="Add or remove vowel marks on this word">
          <span class="marks-label">Harakat</span>
          <button class="mark" data-mark="َ" lang="fa">َ<span>zabar</span></button>
          <button class="mark" data-mark="ُ" lang="fa">ُ<span>pesh</span></button>
          <button class="mark" data-mark="ِ" lang="fa">ِ<span>zer</span></button>
          <button class="mark" data-mark="ْ" lang="fa">ْ<span>sukun</span></button>
          <button class="mark mark-clear" data-mark="clear">⌫<span>clear</span></button>
        </div>
        <div class="popup-actions">
          <button class="popup-ghost">Grammar</button>
          <button class="popup-save" id="popupSave">Save to Words</button>
        </div>
      </div>
    </div>
  </section>

</div>
<script src="app.js?v=12"></script>
</body>
</html>
